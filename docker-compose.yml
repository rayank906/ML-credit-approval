version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/creditdb
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_NAME: ml_jobs
      JWT_SECRET: change-me-to-a-random-hex-string
      ADMIN_ENROLLMENT_CODE: change-me-code
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditdb
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  db_data:
